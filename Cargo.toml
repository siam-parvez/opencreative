[workspace]
resolver = "3"
members = [
    "crates/opencreative-protocol",
    "crates/opencreative-device",
    "crates/opencreative-sensors",
    "crates/opencreative-render",
    "crates/opencreative-core",
    "crates/opencreative-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/siam-parvez/opencreative"
authors = ["OpenCreative contributors"]

[workspace.dependencies]
opencreative-protocol = { path = "crates/opencreative-protocol" }
opencreative-device = { path = "crates/opencreative-device" }
opencreative-sensors = { path = "crates/opencreative-sensors" }
opencreative-render = { path = "crates/opencreative-render" }
opencreative-core = { path = "crates/opencreative-core" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
nusb = "0.2"
sysinfo = "0.38"
tiny-skia = "0.12"
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
lto = "thin"
strip = true
