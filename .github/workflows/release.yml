# Push a tag like `v0.3.0` (matching the workspace version) to build Linux
# packages for x86_64 and ARM64 and publish them as a GitHub release:
# a tarball, a .deb, an .rpm and an AppImage per architecture.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - { os: ubuntu-22.04, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, arch: aarch64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build
        run: cargo build --release --locked -p opencreative-cli -p opencreative-gui

      - name: Tarball
        run: |
          name="opencreative-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/opencreative target/release/opencreative-gui "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r packaging/linux "dist/$name/packaging"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - name: .deb and .rpm
        run: |
          cargo deb -p opencreative-gui --no-build --output dist/
          cargo generate-rpm -p crates/opencreative-gui --output dist/

      - name: AppImage
        env:
          # Runners have no FUSE; run appimagetool from its extracted files.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p tools
          curl -sSfL -o tools/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x tools/appimagetool
          PATH="$PWD/tools:$PATH" packaging/linux/build-appimage.sh target/release \
            ${{ matrix.arch }} "dist/OpenCreative-${GITHUB_REF_NAME}-${{ matrix.arch }}.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "OpenCreative $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
