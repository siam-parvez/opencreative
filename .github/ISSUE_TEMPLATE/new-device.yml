name: Support a new device
description: Help add a DeepCool cooler or screen that OpenCreative doesn't support yet.
title: "Device: "
labels: ["new device"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! See [Adding a device](https://github.com/siam-parvez/opencreative/blob/main/docs/adding-a-device.md) for how to collect this.
  - type: input
    id: model
    attributes:
      label: Exact model
      description: From the box, e.g. "LQ360 White".
    validations:
      required: true
  - type: textarea
    id: lsusb
    attributes:
      label: "`lsusb` line and `sudo lsusb -v -d 3633:`"
      render: text
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What OpenCreative does
      description: Output of `opencreative list`, and what the screen does with `opencreative --no-daemon solid ff0000`.
      render: text
  - type: textarea
    id: capture
    attributes:
      label: DeepCreative USB capture
      description: Attach the .pcapng and list the steps you took with their times.
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: The device, and its screen running DeepCreative if you can.
